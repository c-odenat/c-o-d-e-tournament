<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5fbeaa"/>
      <stop offset="100%" style="stop-color:#3d9a87"/>
    </linearGradient>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#bgGrad)"/>
  
  <!-- Subtle shine overlay -->
  <rect x="32" y="32" width="448" height="224" rx="80" ry="80" fill="url(#shineGrad)"/>
  
  <!-- Trophy cup body -->
  <path d="M176 140 h160 c0 0 20 0 20 20 v60 c0 80 -40 120 -100 140 c-60 -20 -100 -60 -100 -140 v-60 c0 -20 20 -20 20 -20z" 
        fill="url(#trophyGrad)" stroke="#e6a800" stroke-width="4"/>
  
  <!-- Left handle -->
  <path d="M176 170 c-40 0 -50 10 -50 50 c0 40 20 60 50 60" 
        fill="none" stroke="url(#trophyGrad)" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Right handle -->
  <path d="M336 170 c40 0 50 10 50 50 c0 40 -20 60 -50 60" 
        fill="none" stroke="url(#trophyGrad)" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Trophy stem -->
  <rect x="232" y="340" width="48" height="50" fill="url(#trophyGrad)" stroke="#e6a800" stroke-width="3"/>
  
  <!-- Trophy base -->
  <rect x="190" y="380" width="132" height="24" rx="6" ry="6" fill="url(#trophyGrad)" stroke="#e6a800" stroke-width="3"/>
  <rect x="170" y="396" width="172" height="28" rx="8" ry="8" fill="url(#trophyGrad)" stroke="#e6a800" stroke-width="3"/>
  
  <!-- Star on trophy -->
  <polygon points="256,175 266,205 298,205 272,225 282,255 256,235 230,255 240,225 214,205 246,205" 
           fill="#ffffff" opacity="0.95"/>
  
  <!-- Sparkles -->
  <circle cx="140" cy="120" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="372" cy="100" r="6" fill="#ffffff" opacity="0.7"/>
  <circle cx="400" cy="160" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="112" cy="180" r="4" fill="#ffffff" opacity="0.5"/>
</svg>
